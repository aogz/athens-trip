<style>
  :root {

    --line: #e2dccf;

  }
  html.big { --fs: 24px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: var(--fs); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);

  h2 { font-size: 1.45rem; margin: 0 0 4px; line-height: 1.25; }
  h3 { font-size: 1.15rem; margin: 24px 0 10px; color: var(--blue-dark); }
  p { margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 1rem; margin-bottom: 20px; }

  /* Buttons: everything tappable is big */
  .btn {
    display: flex; align-items: center; gap: 14px; width: 100%;
    min-height: 64px; padding: 14px 18px; margin: 0 0 12px;
    font: inherit; font-size: 1.1rem; font-weight: 600; text-align: left; text-decoration: none;
    color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 16px;

  .btn .ico { font-size: 1.7rem; line-height: 1; flex: none; width: 2rem; text-align: center; }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn.green { background: var(--green); color: #fff; border-color: var(--green); }
  .btn.red { background: var(--red); color: #fff; border-color: var(--red); }
  .btn.center { justify-content: center; text-align: center; }

  .day {
    display: block; width: 100%; padding: 18px; margin: 0 0 14px; text-align: left;
    font: inherit; color: var(--ink); text-decoration: none;
    background: var(--card); border: 2px solid var(--line); border-radius: 20px; cursor: pointer;
  }
  .day.today { border: 4px solid var(--blue); }
  .day .row { display: flex; align-items: center; gap: 14px; }
  .day .big-ico { font-size: 2.6rem; line-height: 1; }
  .day .label { font-size: 1.5rem; font-weight: 800; color: var(--blue-dark); }
  .day .what { font-size: 1.05rem; color: var(--muted); }
  .badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 99px; font-size: .9rem; font-weight: 700; background: var(--sand); }
  .badge.today { background: var(--blue); color: #fff; margin: 0 0 8px; }
  .badge.done { background: var(--green-soft); color: var(--green); }

  .stop { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 18px; margin: 0 0 18px; }
  .stop.is-done { border-color: var(--green); background: #f6fbf7; }
  .stop-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 10px; }
  .num {
    flex: none; width: 2.4rem; height: 2.4rem; border-radius: 50%;
    display: grid; place-items: center; font-weight: 800; font-size: 1.2rem;
    background: var(--blue); color: #fff;
  }
  .is-done .num { background: var(--green); }
  .time { font-size: 1rem; font-weight: 700; color: var(--blue); }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
  .facts span { background: var(--sand); padding: 4px 12px; border-radius: 99px; font-size: .95rem; font-weight: 600; }
  .how { background: var(--blue-soft); border-radius: 14px; padding: 12px 14px; margin: 0 0 12px; font-size: 1rem; }
  .tips { margin: 0 0 14px; padding: 0; list-style: none; }
  .tips li { position: relative; padding-left: 1.6rem; margin-bottom: 8px; font-size: 1rem; }
  .tips li::before { content: "•"; position: absolute; left: .4rem; color: var(--blue); font-weight: 900; }
  .optional { display: inline-block; background: #fff4d6; color: #7a5200; font-weight: 700; font-size: .9rem; padding: 2px 10px; border-radius: 99px; margin-bottom: 6px; }

  /* Sticky bottom bar on inner screens */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(251, 247, 239, .97); border-top: 2px solid var(--line);

  .bar .btn { margin: 0; min-height: 60px; padding: 10px 8px; gap: 8px; justify-content: center; font-size: 1.05rem; white-space: nowrap; }

    display: inline-flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 10px 16px 10px 10px;

  .phrase { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .phrase .ru { font-size: 1rem; color: var(--muted); }
  .phrase .say { font-size: 1.4rem; font-weight: 800; color: var(--blue-dark); }
  .phrase .gr { font-size: 1rem; color: var(--muted); }

  .note { background: #fff4d6; border-radius: 14px; padding: 12px 14px; margin: 0 0 14px; font-size: 1rem; }

  /* Full-screen taxi card */
  .taxi { position: fixed; inset: 0; z-index: 20; background: #fff; overflow: auto;

  .taxi .hint { font-size: 1rem; color: var(--muted); text-align: center; margin-bottom: 18px; }
  .taxi .please { font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 18px; }
  .taxi .dest { font-size: 2.3rem; font-weight: 800; line-height: 1.2; text-align: center; color: #000; margin-bottom: 16px; word-wrap: break-word; }
  .taxi .latin { font-size: 1.2rem; text-align: center; color: var(--muted); margin-bottom: 24px; }
  .taxi .spacer { flex: 1; }
</style>

        ],
        nav: 'Athens International Airport', mode: 'driving',
        greek: 'Αεροδρόμιο<br>«Ελευθέριος Βενιζέλος»', latin: 'Athens International Airport',
      },
    ],
  },
];

const PHRASES = [
  ['Здравствуйте', 'Я́сас', 'Γειά σας'],
  ['Спасибо', 'Эфхаристо́', 'Ευχαριστώ'],
  ['Пожалуйста', 'Паракало́', 'Παρακαλώ'],
  ['Да', 'Нэ', 'Ναι'],
  ['Нет', 'О́хи', 'Όχι'],
  ['Счёт, пожалуйста', 'Тон логариазмо́, паракало́', 'Τον λογαριασμό, παρακαλώ'],
  ['Вода', 'Неро́', 'Νερό'],
  ['Где туалет?', 'Пу и́нэ и туалэ́та?', 'Πού είναι η τουαλέτα;'],
  ['Сколько стоит?', 'По́со ка́ни?', 'Πόσο κάνει;'],
  ['Можно картой?', 'Боро́ мэ ка́рта?', 'Μπορώ με κάρτα;'],
];

/* ================================================================ */

const app = document.getElementById('app');
const doneKey = 'athens-done';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let done = load(doneKey, {});
if (load('athens-big', false)) document.documentElement.classList.add('big');

const mapsUrl = (dest, mode) =>
  'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest) + '&travelmode=' + (mode || 'transit');

function todayIndex() {
  if (!CONFIG.tripStart) return -1;
  const start = new Date(CONFIG.tripStart + 'T00:00:00');
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const i = Math.round((now - start) / 86400000);
  return i >= 0 && i < DAYS.length ? i : -1;
}

const backBtn = (to = '#') => `<button class="back" onclick="go('${to}')">← Назад</button>`;
const bar = () => `
  <nav class="bar">
    <a class="btn" href="#"><span class="ico">🏠</span>Главная</a>
    <a class="btn primary" href="#hotel"><span class="ico">🏨</span>В отель</a>
  </nav>`;

function home() {
  const t = todayIndex();
  const days = DAYS.map((d, i) => {
    const n = d.stops.filter(s => done[s.id]).length;
    return `
      <a class="day ${i === t ? 'today' : ''}" href="#day/${i}">
        ${i === t ? '<span class="badge today">Сегодня</span>' : ''}
        <div class="row">
          <span class="big-ico">${d.ico}</span>
          <div>
            <div class="label">${d.label}</div>
            <div class="what">${d.what}</div>
          </div>
        </div>
        ${n ? `<span class="badge ${n === d.stops.length ? 'done' : ''}">✓ Посетили ${n} из ${d.stops.length}</span>` : ''}
      </a>`;
  }).join('');
  return `
    <h1>Афины 🇬🇷</h1>
    <p class="sub">Ваша поездка на 2,5 дня. Выберите день:</p>
    ${days}
    <h3>Если нужна помощь</h3>
    <a class="btn primary" href="#hotel"><span class="ico">🏨</span>Вернуться в отель</a>
    <a class="btn" href="#taxi/hotel"><span class="ico">🚕</span>Адрес отеля для таксиста</a>
    <a class="btn" href="#help"><span class="ico">📞</span>Телефоны и помощь</a>
    <a class="btn" href="#words"><span class="ico">💬</span>Греческие слова</a>
    ${installHint()}`;
}

function day(i) {
  const d = DAYS[i];
  if (!d) return home();
  const stops = d.stops.map((s, k) => `
    <section class="stop ${done[s.id] ? 'is-done' : ''}">
      <div class="stop-head">
        <div class="num">${done[s.id] ? '✓' : k + 1}</div>
        <div>
          ${s.optional ? '<span class="optional">По желанию</span>' : ''}
          <div class="time">${s.time}</div>
          <h2>${s.ico} ${s.title}</h2>
        </div>
      </div>
      <p>${s.text}</p>
      <div class="facts">${s.facts.map(f => `<span>${f}</span>`).join('')}</div>
      <div class="how">🧭 ${s.how}</div>
      <ul class="tips">${s.tips.map(t => `<li>${t}</li>`).join('')}</ul>
      <a class="btn primary" href="${mapsUrl(s.nav, s.mode)}" target="_blank" rel="noopener"><span class="ico">🗺️</span>Как добраться (карта)</a>
      <a class="btn" href="#taxi/${s.id}"><span class="ico">🚕</span>Показать таксисту</a>
      <button class="btn ${done[s.id] ? 'green' : ''}" onclick="toggleDone('${s.id}')">
        <span class="ico">${done[s.id] ? '✅' : '⬜'}</span>${done[s.id] ? 'Готово — я здесь была' : 'Отметить: я здесь была'}
      </button>
    </section>`).join('');
  return `
    ${backBtn()}
    <h1>${d.ico} ${d.label}</h1>
    <p class="sub">${d.what}. Идите по порядку, сверху вниз. Время — примерное, не спешите!</p>
    ${stops}
    ${i + 1 < DAYS.length ? `<a class="btn center" href="#day/${i + 1}">Следующий день →</a>` : ''}
    ${bar()}`;
}

function hotel() {
  return `
    ${backBtn()}
    <h1>🏨 Вернуться в отель</h1>
    <p class="sub">${HOTEL.name}, улица Вулгари 13 — в 2 минутах от метро «Омония».</p>
    <a class="btn primary" href="#taxi/hotel"><span class="ico">🚕</span>Поехать на такси — показать адрес</a>
    <a class="btn" href="${mapsUrl(HOTEL.maps, 'transit')}" target="_blank" rel="noopener"><span class="ico">🚇</span>Маршрут на метро (карта)</a>
    <a class="btn" href="${mapsUrl(HOTEL.maps, 'walking')}" target="_blank" rel="noopener"><span class="ico">🚶‍♀️</span>Маршрут пешком (карта)</a>
    <a class="btn" href="tel:${HOTEL.phone}"><span class="ico">📞</span>Позвонить в отель</a>
    <div class="note">Метро рядом с отелем — станция <b>«Омония»</b> (Ομόνοια). Там встречаются красная и зелёная линии.</div>
    ${bar()}`;
}

function help() {
  const fam = CONFIG.familyPhone
    ? `<a class="btn green" href="tel:${CONFIG.familyPhone}"><span class="ico">❤️</span>Позвонить ${CONFIG.familyName || 'родным'}</a>` : '';
  return `
    ${backBtn()}
    <h1>📞 Помощь</h1>
    ${fam}
    <a class="btn" href="tel:${HOTEL.phone}"><span class="ico">🏨</span>Отель: ${HOTEL.phoneShown}</a>
    <a class="btn red" href="tel:112"><span class="ico">🆘</span>Скорая, полиция: 112</a>
    <a class="btn" href="tel:1571"><span class="ico">👮</span>Туристическая полиция: 1571</a>
    <p class="sub">По номерам 112 и 1571 говорят по-английски.</p>

    <h3>Полезно знать</h3>
    <ul class="tips">
      <li>Вода из-под крана в Афинах — питьевая.</li>
      <li>Такси по центру недорогое: обычно 5–10 €. Можно платить картой — скажите водителю заранее: «ка́рта».</li>
      <li>Аптека — вывеска с <b>зелёным крестом</b>.</li>
      <li>Чаевые в кафе — округлите сумму или оставьте 5–10 %.</li>
      <li>Часы работы музеев осенью меняются — если сомневаетесь, спросите на ресепшене.</li>
    </ul>

    <h3>Размер текста</h3>
    <button class="btn" onclick="toggleBig()"><span class="ico">🔍</span>${document.documentElement.classList.contains('big') ? 'Сделать текст обычным' : 'Сделать текст крупнее'}</button>
    ${bar()}`;
}

function words() {
  return `
    ${backBtn()}
    <h1>💬 Греческие слова</h1>
    <div class="note">Внимание: «<b>Нэ</b>» по-гречески значит «<b>ДА</b>», а не «нет»!</div>
    ${PHRASES.map(([ru, say, gr]) => `
      <div class="phrase">
        <div class="ru">${ru}</div>
        <div class="say">${say}</div>
        <div class="gr">${gr}</div>
      </div>`).join('')}
    ${bar()}`;
}

function taxi(id) {
  const s = id === 'hotel' ? HOTEL : DAYS.flatMap(d => d.stops).find(x => x.id === id);
  if (!s) return home();
  return `
    <div class="taxi">
      <div class="hint">Покажите этот экран водителю такси</div>
      <div class="please">Παρακαλώ, πηγαίνετέ με εδώ:</div>
      <div class="dest">${s.greek}</div>
      <div class="latin">${s.latin}</div>
      <div class="spacer"></div>
      <button class="btn primary center" onclick="history.length > 1 ? history.back() : go('#')">✕ Закрыть</button>
    </div>`;
}

function installHint() {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return '';
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `
    <h3>Добавить на экран телефона</h3>
    ${deferredPrompt ? '<button class="btn green" onclick="install()"><span class="ico">📲</span>Установить приложение</button>' : ''}
    <div class="note">${ios
      ? 'В Safari нажмите кнопку «Поделиться» (квадрат со стрелкой ↑) и выберите <b>«На экран „Домой“»</b>.'
      : 'В Chrome нажмите <b>⋮</b> (три точки вверху) и выберите <b>«Установить приложение»</b> или «Добавить на главный экран».'}
      Тогда иконка «Афины» будет на экране, и приложение откроется даже без интернета.</div>`;
}

/* ---------- router ---------- */
function render() {
  const [route, arg] = location.hash.replace(/^#/, '').split('/');
  const view = {
    day: () => day(+arg), hotel, help, words, taxi: () => taxi(arg),
  }[route];
  app.innerHTML = view ? view() : home();
  if (route !== 'taxi') window.scrollTo(0, scrollMemory[location.hash] || 0);
}
const scrollMemory = {};
let lastHash = location.hash;
window.addEventListener('hashchange', () => {
  scrollMemory[lastHash] = scrollMemory._pending ?? window.scrollY;
  delete scrollMemory._pending;
  lastHash = location.hash;
  render();
});
// The taxi screen sits on top, so remember where we were before opening it.
document.addEventListener('click', () => { scrollMemory._pending = window.scrollY; }, true);
function go(h) { location.hash = h; }

function toggleDone(id) {
  done[id] = !done[id];
  save(doneKey, done);
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}
function toggleBig() {
  const big = document.documentElement.classList.toggle('big');
  save('athens-big', big);
  render();
}

/* ---------- PWA ---------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (!location.hash) render(); });
async function install() { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; render(); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

render();
</script>
</body>
</html>
